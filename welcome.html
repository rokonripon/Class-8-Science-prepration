<!DOCTYPE html>
<html>
<head>
    <style>
        body { background: #1a1a1a; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .welcome { font-size: 3em; font-weight: bold; background: linear-gradient(45deg, #f39c12, #e74c3c, #9b59b6, #3498db); 
                   -webkit-background-clip: text; -webkit-text-fill-color: transparent; animation: zoom 2s infinite alternate; }
        @keyframes zoom { from { transform: scale(0.8); } to { transform: scale(1.2); } }
    </style>
    <script>setTimeout(() => { window.location.href = 'index.html'; }, 3000);</script>
</head>
<body><div class="welcome">Welcome</div></body>
</html>
