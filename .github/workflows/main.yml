name: Build APK
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Cordova
        run: |
          npm install -g cordova
          # লেটেস্ট নোড এনভায়রনমেন্ট সেটআপ

      - name: Create and Build Project
        run: |
          # ১. পুরনো ফাইল থাকলে পরিষ্কার করা
          rm -rf build_dir
          
          # ২. নতুন প্রজেক্ট তৈরি
          cordova create build_dir com.writer.sheshjosna "Shesh Josna"
          
          # ৩. আপনার সব ফাইল কপি করা
          cp -r *.html build_dir/www/ || true
          cp -r *.png build_dir/www/ || true
          cp -r *.jpg build_dir/www/ || true
          cp config.xml build_dir/config.xml || true
          
          cd build_dir
          
          # ৪. লিঙ্ক সচল করার প্লাগইন যোগ করা
          cordova plugin add cordova-plugin-inappbrowser
          
          # ৫. অ্যান্ড্রয়েড বিল্ড
          cordova platform add android
          cordova build android --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Shesh-Josna-App
          path: build_dir/platforms/android/app/build/outputs/apk/debug/app-debug.apk
