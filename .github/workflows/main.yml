name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - run: npm install -g cordova
      - run: |
          # ১. প্রজেক্ট তৈরি ও ফাইল কপি
          cordova create build_dir com.writer.sheshjosna "ScienceHelper"
          cp -r * build_dir/www/ || true
          cp icon.png build_dir/www/icon.png || true
          cp config.xml build_dir/config.xml || true
          
          cd build_dir
          
          # ২. লিঙ্ক সচল করার প্লাগইন যোগ
          cordova plugin add cordova-plugin-inappbrowser
          
          # ৩. অটো-প্যাচ স্ক্রিপ্ট: আপনার index.html এর লিঙ্কগুলো অ্যাপে সচল করবে
          # এটি ক্লিক করলে সরাসরি ফোনের ব্রাউজার ওপেন হবে
          sed -i 's/window.location.href=/window.open(/g' www/index.html
          sed -i 's/onclick="window.open(/onclick="window.open(/g' www/index.html
          
          # বাইরের সব লিঙ্কে (a href) ব্রাউজার ওপেন ট্যাগ যোগ করা
          find www/ -name "*.html" -exec sed -i 's/<a /<a onclick="window.open(this.href, '"'_system'"'); return false;" /g' {} +

          # ৪. প্ল্যাটফর্ম যোগ ও বিল্ড
          cordova platform add android
          cordova build android --debug --device
          
      - uses: actions/upload-artifact@v4
        with:
          name: Science-Helper-App
          path: build_dir/platforms/android/app/build/outputs/apk/debug/app-debug.apk
