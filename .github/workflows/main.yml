name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Cordova
        run: npm install -g cordova

      - name: Create Cordova Project and Build
        run: |
          # প্রজেক্ট তৈরি
          cordova create build_dir com.writer.sheshjosna "Shesh Josna"
          
          # www ফোল্ডারে আপনার ফাইলগুলো কপি করা
          cp -r * build_dir/www/ || true
          
          # যদি config.xml থাকে তবে সেটি প্রজেক্টে কপি করা
          if [ -f "config.xml" ]; then
            cp config.xml build_dir/config.xml
          fi
          
          cd build_dir
          
          # অ্যান্ড্রয়েড প্ল্যাটফর্ম যোগ করা
          cordova platform add android
          
          # বিল্ড করা
          cordova build android --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: shesh-josna-app
          path: build_dir/platforms/android/app/build/outputs/apk/debug/app-debug.apk
