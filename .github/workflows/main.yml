name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - run: npm install -g cordova
      - run: |
          cordova create build_dir com.writer.sheshjosna "SheshJosna"
          cp -r * build_dir/www/ || true
          # লোগোটি সরাসরি www ফোল্ডারে কপি করার কমান্ড
          cp icon.png build_dir/www/icon.png || true
          cp config.xml build_dir/config.xml || true
          cd build_dir
          cordova platform add android
          # গ্র্যাডেল এরর এড়াতে এই কমান্ডটি জরুরি
          cordova build android --debug --device
      - uses: actions/upload-artifact@v4
        with:
          name: shesh-josna-app
          path: build_dir/platforms/android/app/build/outputs/apk/debug/app-debug.apk
