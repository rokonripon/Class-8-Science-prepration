name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - run: npm install -g cordova
      - run: |
          cordova create build_dir com.writer.sheshjosna "SheshJosna"
          cp -r * build_dir/www/ || true
          cp icon.png build_dir/www/icon.png || true
          cp config.xml build_dir/config.xml || true
          
          cd build_dir
          
          # ১. লিঙ্ক সচল করার জন্য প্লাগইন যোগ করা
          cordova plugin add cordova-plugin-inappbrowser
          
          # ২. অটো-স্ক্রিপ্ট: এটি আপনার সব ফাইলের লিঙ্ককে অটোমেটিক ব্রাউজারে ওপেন করার ব্যবস্থা করবে
          # এটি করলে আপনাকে ৩২টি ফাইলের একটিও এডিট করতে হবে না
          find www/ -name "*.html" -exec sed -i 's/<a /<a onclick="window.open(this.href, '"'_system'"'); return false;" /g' {} +

          cordova platform add android
          cordova build android --debug --device
          
      - uses: actions/upload-artifact@v4
        with:
          name: shesh-josna-app
          path: build_dir/platforms/android/app/build/outputs/apk/debug/app-debug.apk
