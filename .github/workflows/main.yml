name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - run: npm install -g cordova
      - run: |
          # ১. প্রজেক্ট তৈরি ও ফাইল কপি
          cordova create build_dir com.writer.sheshjosna "SheshJosna"
          cp -r * build_dir/www/ || true
          cp icon.png build_dir/www/icon.png || true
          cp config.xml build_dir/config.xml || true
          
          cd build_dir
          
          # ২. লিঙ্ক সচল করার প্লাগইন যোগ
          cordova plugin add cordova-plugin-inappbrowser
          
          # ৩. অটো-লিঙ্ক ফিক্সার (আপনার ৩২টি ফাইলের লিঙ্ক ব্রাউজারে ওপেন করার ম্যাজিক লাইন)
          # এটি সব <a href="..."> কে ব্রাউজারে খোলার উপযোগী করে দেবে
          find www/ -name "*.html" -exec sed -i 's/<a href="http/<a onclick="window.open(this.href, '"'_system'"'); return false;" href="http/g' {} +

          # ৪. প্ল্যাটফর্ম যোগ ও বিল্ড
          cordova platform add android
          cordova build android --debug --device
          
      - uses: actions/upload-artifact@v4
        with:
          name: shesh-josna-app
          path: build_dir/platforms/android/app/build/outputs/apk/debug/app-debug.apk
