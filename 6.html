<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>অধ্যায় কুইজ - অষ্টম শ্রেণি</title>
    <style>
        :root { --primary: #e67e22; --secondary: #d35400; --success: #27ae60; --danger: #e74c3c; }
        body { background-color: #f4f7f6; margin: 0; padding: 10px; }
        .quiz-container { max-width: 750px; margin: 20px auto; background: white; padding: 30px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); font-family: 'SolaimanLipi', Arial, sans-serif; }
        h2 { color: var(--primary); text-align: center; border-bottom: 2px solid #eee; padding-bottom: 15px; }
        input[type="text"], select { width: 100%; padding: 15px; border: 2px solid #ddd; border-radius: 10px; font-size: 16px; box-sizing: border-box; margin-bottom: 15px; }
        .question-box { display: none; }
        .question-box.active { display: block; animation: fadeIn 0.4s; }
        .option { display: block; background: #f9f9f9; padding: 15px; margin: 10px 0; border: 2px solid #eee; border-radius: 10px; cursor: pointer; transition: 0.3s; }
        .option:hover { background: #fff5eb; border-color: var(--primary); }
        .btn { background: var(--primary); color: white; border: none; padding: 15px 25px; border-radius: 10px; cursor: pointer; font-size: 18px; width: 100%; font-weight: bold; }
        .score-box { font-size: 24px; font-weight: bold; color: var(--success); text-align: center; margin: 15px 0; padding: 20px; background: #f1f9f1; border-radius: 10px; border: 1px solid #d4edda; }
        .time-box { text-align: center; font-size: 18px; color: #e67e22; margin-bottom: 15px; font-weight: bold; }
        .review-item { margin-bottom: 20px; padding: 15px; border-radius: 10px; border-left: 6px solid #ccc; background: #fafafa; }
        .explanation { margin-top: 10px; padding: 10px; background: #fdf4ea; border-radius: 5px; font-size: 14px; color: #444; border-left: 3px solid var(--primary); }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body>

<div class="quiz-container">
    <div id="start-screen">
        <h2 id="chapter-title">অধ্যায় ৬: পরমাণুর গঠন</h2>
        <p style="text-align:center; color:#666;">অষ্টম শ্রেণি - বিজ্ঞান (২০২৬ সংস্করণ)</p>
        <input type="text" id="username" placeholder="আপনার নাম লিখুন...">
        <button type="button" class="btn" onclick="startQuiz()">কুইজ শুরু করুন</button>
    </div>

    <div id="quiz-screen" style="display:none;">
        <div id="timer-display" class="time-box">সময়: 00:00</div>
        <div id="progress" style="text-align:right; font-weight:bold; margin-bottom:10px; color:#7f8c8d;"></div>
        <div id="question-container"></div>
    </div>

    <div id="result-screen" style="display:none;">
        <h2>ফলাফল কার্ড</h2>
        <div id="res-info" style="text-align:center; margin-bottom:10px;"></div>
        <div class="score-box" id="final-score"></div>
        <p id="db-status" style="text-align:center; color: #27ae60; font-weight: bold;"></p>
        <hr>
        <div id="review-section"></div>
        <button class="btn" onclick="location.reload()" style="background:#7f8c8d; margin-top:20px;">আবার শুরু করুন</button>
    </div>
</div>

<script>
const quizData = [
    { q: "পরমাণুর কেন্দ্রে কী থাকে?", a: ["ইলেকট্রন", "নিউক্লিয়াস", "কক্ষপথ", "অণু"], c: 1, e: "পরমাণুর কেন্দ্রে অতি ক্ষুদ্র স্থানে প্রোটন ও নিউট্রন থাকে, যাকে নিউক্লিয়াস বলে।" },
    { q: "নিউক্লিয়াসে কোন কোন কণিকা থাকে?", a: ["ইলেকট্রন ও প্রোটন", "প্রোটন ও নিউট্রন", "ইলেকট্রন ও নিউট্রন", "শুধু প্রোটন"], c: 1, e: "নিউক্লিয়াস প্রোটন ও নিউট্রন দ্বারা গঠিত।" },
    { q: "ইলেকট্রনের আধান বা চার্জ কেমন?", a: ["ধনাত্মক", "ঋণাত্মক", "নিরপেক্ষ", "আধানহীন"], c: 1, e: "ইলেকট্রন ঋণাত্মক (-) চার্জযুক্ত কণিকা যা নিউক্লিয়াসের চারপাশে ঘোরে।" },
    { q: "পরমাণুর মৌলিক কণিকা কয়টি?", a: ["২টি", "৩টি", "৪টি", "৫টি"], c: 1, e: "পরমাণুর স্থায়ী মৌলিক কণিকা ৩টি: ইলেকট্রন, প্রোটন ও নিউট্রন।" },
    { q: "কোনো মৌলের প্রোটন সংখ্যাকে কী বলা হয়?", a: ["ভর সংখ্যা", "পারমাণবিক সংখ্যা", "যোজনী", "আইসোটোপ"], c: 1, e: "একটি মৌলের পরমাণুতে অবস্থিত প্রোটনের সংখ্যাই তার পারমাণবিক সংখ্যা।" },
    { q: "পরমাণুর ভর সংখ্যা বলতে কী বোঝায়?", a: ["প্রোটন ও ইলেকট্রনের যোগফল", "প্রোটন ও নিউট্রনের যোগফল", "ইলেকট্রন ও নিউট্রনের যোগফল", "শুধু নিউট্রন সংখ্যা"], c: 1, e: "ভর সংখ্যা = প্রোটন সংখ্যা + নিউট্রন সংখ্যা।" },
    { q: "সোডিয়ামের (Na) পারমাণবিক সংখ্যা কত?", a: ["১০", "১১", "১২", "২৩"], c: 1, e: "সোডিয়ামের প্রোটন সংখ্যা বা পারমাণবিক সংখ্যা ১১।" },
    { q: "হাইড্রোজেনের কয়টি আইসোটোপ আছে?", a: ["২টি", "৩টি", "৪টি", "৫টি"], c: 1, e: "হাইড্রোজেনের ৩টি প্রধান আইসোটোপ হলো: প্রোটিয়াম, ডিউটেরিয়াম ও ট্রিটিয়াম।" },
    { q: "আইসোটোপের ক্ষেত্রে কোনটি ভিন্ন হয়?", a: ["প্রোটন সংখ্যা", "পারমাণবিক সংখ্যা", "নিউট্রন সংখ্যা", "ইলেকট্রন সংখ্যা"], c: 2, e: "আইসোটোপের প্রোটন সংখ্যা এক থাকলেও নিউট্রন সংখ্যা ভিন্ন হওয়ায় ভর সংখ্যা ভিন্ন হয়।" },
    { q: "ক্যান্সার কোষ ধ্বংস করতে কোন আইসোটোপ ব্যবহৃত হয়?", a: ["কার্বন-১৪", "কোবাল্ট-৬০", "আয়োডিন-১৩১", "ফসফরাস-৩২"], c: 1, e: "কোবাল্ট-৬০ থেকে নির্গত গামা রশ্মি ক্যান্সার চিকিৎসায় ব্যবহৃত হয়।" },
    { q: "প্রথম কক্ষপথে (K শেল) সর্বোচ্চ কয়টি ইলেকট্রন থাকতে পারে?", a: ["২টি", "৮টি", "১৮টি", "৩২টি"], c: 0, e: "সূত্র $2n^2$ অনুযায়ী প্রথম কক্ষপথে ($n=1$) ২ জন ইলেকট্রন থাকতে পারে।" },
    { q: "পরমাণুর বেশিরভাগ স্থান কেমন?", a: ["কঠিন", "ফাঁপা", "তরল", "ভারী"], c: 1, e: "রাদারফোর্ডের পরীক্ষা অনুযায়ী পরমাণুর বেশিরভাগ স্থানই ফাঁপা।" },
    { q: "পরমাণু সামগ্রিকভাবে কেমন হয়?", a: ["ধনাত্মক", "ঋণাত্মক", "আধান নিরপেক্ষ", "অস্থায়ী"], c: 2, e: "প্রোটন ও ইলেকট্রন সংখ্যা সমান হওয়ায় পরমাণু চার্জহীন বা নিরপেক্ষ হয়।" },
    { q: "ইলেকট্রন ত্যাগের ফলে পরমাণু কিসে পরিণত হয়?", a: ["অ্যানায়ন", "ক্যাটায়ন", "আইসোটোপ", "নিষ্ক্রিয় গ্যাস"], c: 1, e: "ইলেকট্রন ত্যাগ করলে ধনাত্মক চার্জযুক্ত ক্যাটায়ন তৈরি হয়।" },
    { q: "ক্লোরিন পরমাণু একটি ইলেকট্রন গ্রহণ করলে কী তৈরি হয়?", a: ["$Cl^+$", "$Cl^-$", "$Cl_2$", "$Cl$"], c: 1, e: "ইলেকট্রন গ্রহণ করলে ঋণাত্মক চার্জযুক্ত অ্যানায়ন ($Cl^-$) তৈরি হয়।" },
    { q: "কার্বন-১৪ আইসোটোপ কী কাজে ব্যবহৃত হয়?", a: ["রোগ নির্ণয়ে", "ফসলের উন্নতিতে", "জীবাশ্মের বয়স নির্ধারণে", "বিদ্যুৎ উৎপাদনে"], c: 2, e: "কার্বন ডেটিং বা জীবারশ্মের বয়স বের করতে কার্বন-১৪ ব্যবহৃত হয়।" },
    { q: "একটি মৌলের পারমাণবিক সংখ্যা ১৭ এবং ভর সংখ্যা ৩৫ হলে নিউট্রন সংখ্যা কত?", a: ["১৭", "৩৫", "১৮", "৫২"], c: 2, e: "নিউট্রন সংখ্যা = ভর সংখ্যা - পারমাণবিক সংখ্যা ($35 - 17 = 18$)।" },
    { q: "পরমাণুর সৌর মডেল কে প্রদান করেন?", a: ["ডাল্টন", "নীলস বোর", "রাদারফোর্ড", "থমসন"], c: 2, e: "রাদারফোর্ড পরমাণুর গঠনকে সৌরজগতের সাথে তুলনা করেছিলেন।" },
    { q: "পরমাণুর আধান নিরপেক্ষ কণিকা কোনটি?", a: ["প্রোটন", "ইলেকট্রন", "নিউট্রন", "পজিট্রন"], c: 2, e: "নিউট্রনের কোনো বৈদ্যুতিক চার্জ নেই।" },
    { q: "ম্যাগনেসিয়ামের (Mg) ইলেকট্রন বিন্যাস কোনটি?", a: ["২, ৮", "২, ৮, ২", "২, ৮, ৮", "২, ৮, ১৮"], c: 1, e: "ম্যাগনেসিয়ামের পারমাণবিক সংখ্যা ১২, তাই বিন্যাস ২, ৮, ২।" },
    { q: "আর্গন (Ar) কোন ধরনের মৌল?", a: ["ধাতু", "অধাতু", "নিষ্ক্রিয় গ্যাস", "উপধাতু"], c: 2, e: "আর্গনের শেষ কক্ষপথ ইলেকট্রন দ্বারা পূর্ণ থাকায় এটি নিষ্ক্রিয়।" },
    { q: "কক্ষপথের ইলেকট্রন ধারণ ক্ষমতার সূত্র কোনটি?", a: ["$n^2$", "$2n$", "$2n^2$", "$n+1$"], c: 2, e: "ইলেকট্রন ধারণ ক্ষমতার সূত্র হলো $2n^2$।" },
    { q: "নিউক্লিয়াস কে আবিষ্কার করেন?", a: ["রাদারফোর্ড", "বোর", "চ্যাডউইক", "আইনস্টাইন"], c: 0, e: "আলফা কণা বিচ্ছুরণ পরীক্ষার মাধ্যমে রাদারফোর্ড নিউক্লিয়াস আবিষ্কার করেন।" },
    { q: "পরমাণুর ভর কোথায় কেন্দ্রীভূত থাকে?", a: ["কক্ষপথে", "ইলেকট্রনে", "নিউক্লিয়াসে", "পুরো পরমাণুতে"], c: 2, e: "প্রোটন ও নিউট্রনের ভরই পরমাণুর আসল ভর, যা নিউক্লিয়াসে থাকে।" },
    { q: "কোনটি তেজস্ক্রিয় আইসোটোপের ব্যবহার নয়?", a: ["বিদ্যুৎ উৎপাদন", "খাদ্য সংরক্ষণ", "গয়না তৈরি", "রোগ নিরাময়"], c: 2, e: "গয়না তৈরিতে তেজস্ক্রিয় আইসোটোপ ব্যবহৃত হয় না।" },
    { q: "হিলিয়ামের (He) পারমাণবিক সংখ্যা কত?", a: ["১", "২", "৩", "৪"], c: 1, e: "হিলিয়ামের প্রোটন সংখ্যা ২।" },
    { q: "নিষ্ক্রিয় মৌলগুলোর শেষ কক্ষপথে সাধারণত কয়টি ইলেকট্রন থাকে?", a: ["২টি", "৪টি", "৬টি", "৮টি"], c: 3, e: "হিলিয়াম বাদে অন্য নিষ্ক্রিয় গ্যাসগুলোর শেষে ৮টি ইলেকট্রন থাকে (অষ্টক পূর্ণ)।" },
    { q: "ঋণাত্মক আধানযুক্ত পরমাণুকে কী বলে?", a: ["ক্যাটায়ন", "অ্যানায়ন", "মৌল", "যৌগ"], c: 1, e: "ইলেকট্রন আধিক্য থাকলে তাকে অ্যানায়ন বলে।" },
    { q: "মানুষের থাইরয়েড গ্রন্থির চিকিৎসায় কোন আইসোটোপ ব্যবহৃত হয়?", a: ["কার্বন-১৪", "আয়োডিন-১৩১", "কোবাল্ট-৬০", "ইউরেনিয়াম"], c: 1, e: "আয়োডিন-১৩১ থাইরয়েড ক্যান্সারের চিকিৎসায় ব্যবহৃত হয়।" },
    { q: "অক্সিজেন পরমাণুতে কয়টি প্রোটন থাকে?", a: ["৬টি", "৭টি", "৮টি", "১৬টি"], c: 2, e: "অক্সিজেনের পারমাণবিক সংখ্যা ৮, অর্থাৎ এতে ৮টি প্রোটন থাকে।" }
];

let currentIdx = 0, score = 0, userSelections = [], savedName = "", startTime, timerInterval;

function startQuiz() {
    savedName = document.getElementById("username").value.trim();
    if (!savedName) { alert("নাম লিখুন!"); return; }
    document.getElementById("start-screen").style.display = "none";
    document.getElementById("quiz-screen").style.display = "block";
    startTime = Date.now();
    timerInterval = setInterval(updateTimer, 1000);
    loadQuestion();
}

function updateTimer() {
    let totalSeconds = Math.floor((Date.now() - startTime) / 1000);
    let m = Math.floor(totalSeconds / 60);
    let s = totalSeconds % 60;
    document.getElementById("timer-display").innerText = `সময়: ${m}:${s < 10 ? '0'+s : s}`;
}

function loadQuestion() {
    const qData = quizData[currentIdx];
    document.getElementById("progress").innerText = `প্রশ্ন: ${currentIdx + 1} / ${quizData.length}`;
    let opts = qData.a.map((opt, i) => `<div class="option" onclick="handleAns(${i})">${opt}</div>`).join("");
    document.getElementById("question-container").innerHTML = `<div class="question-box active"><h3>${qData.q}</h3>${opts}</div>`;
}

function handleAns(i) {
    userSelections.push(i);
    if (i === quizData[currentIdx].c) score++;
    currentIdx++;
    if (currentIdx < quizData.length) loadQuestion(); else finish();
}

function saveToHistory(got, total) {
    let resultData = { subject: "অধ্যায় ৬: পরমাণুর গঠন", score: got + " / " + total, date: new Date().toLocaleString('bn-BD') };
    let history = JSON.parse(localStorage.getItem('quizHistory')) || [];
    history.push(resultData);
    localStorage.setItem('quizHistory', JSON.stringify(history));
}

function finish() {
    clearInterval(timerInterval);
    document.getElementById("quiz-screen").style.display = "none";
    document.getElementById("result-screen").style.display = "block";
    
    let totalSeconds = Math.floor((Date.now() - startTime) / 1000);
    let timeStr = `${Math.floor(totalSeconds / 60)}m ${totalSeconds % 60}s`;

    document.getElementById("res-info").innerHTML = `<b>শিক্ষার্থী:</b> ${savedName} | <b>শ্রেণি:</b> অষ্টম`;
    document.getElementById("final-score").innerText = `স্কোর: ${score} / ${quizData.length}`;
    
    saveToHistory(score, quizData.length);
    submitToGoogleForm(savedName, timeStr, score);

    let review = "<h3>ব্যাখ্যাসহ উত্তরপত্র:</h3>";
    quizData.forEach((item, idx) => {
        let isCorrect = userSelections[idx] === item.c;
        review += `<div class="review-item" style="border-left-color: ${isCorrect ? '#27ae60' : '#e74c3c'}">
            <strong>${idx+1}. ${item.q}</strong><br>
            আপনার উত্তর: ${item.a[userSelections[idx]] || 'N/A'} | সঠিক: ${item.a[item.c]}<br>
            <div class="explanation"><strong>ব্যাখ্যা:</strong> ${item.e}</div></div>`;
    });
    document.getElementById("review-section").innerHTML = review;
}

function submitToGoogleForm(name, time, mark) {
    const formURL = "https://docs.google.com/forms/d/e/1FAIpQLScmDqEtcQ0aJblo-yuHx1HJUU2ePVXI5fEkRdO5y5rWHXoleA/formResponse";
    const formData = new FormData();
    formData.append("entry.1533087260", name);
    formData.append("entry.106740433", "8");
    formData.append("entry.349487629", time);
    formData.append("entry.1940939055", mark + " / " + quizData.length);

    fetch(formURL, { method: "POST", mode: "no-cors", body: formData })
    .then(() => { document.getElementById("db-status").innerText = "✓ ফলাফল সার্ভারে সংরক্ষিত হয়েছে।"; })
    .catch(() => { document.getElementById("db-status").innerText = "⚠ ডাটা সেভ করতে সমস্যা হয়েছে।"; });
}
</script>
