name: Build APK
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Cordova
        run: npm install -g cordova

      - name: Build Cordova Project
        run: |
          # প্রজেক্ট ফোল্ডার তৈরি
          cordova create my_build com.writer.sheshjosna "Shesh Josna"
          
          # আপনার সব ফাইল কপি করা (index, welcome, সব html ও ছবি)
          cp -r *.html my_build/www/ || true
          cp -r *.png my_build/www/ || true
          cp -r *.jpg my_build/www/ || true
          cp config.xml my_build/config.xml || true
          
          cd my_build
          cordova plugin add cordova-plugin-inappbrowser
          cordova platform add android
          cordova build android --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Shesh-Josna-App
          path: my_build/platforms/android/app/build/outputs/apk/debug/app-debug.apk
