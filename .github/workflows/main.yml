name: Build APK
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4 # লেটেস্ট ভার্সন

      - name: Set up JDK 17 # অ্যান্ড্রয়েড বিল্ডের জন্য এখন ১৭ বেশি ভালো
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Cordova
        run: npm install -g cordova

      - name: Create and Configure Project
        run: |
          # ১. প্রজেক্ট তৈরি করা
          cordova create build_dir com.writer.sheshjosna "Shesh Josna"
          
          # ২. তোমার সব ফাইল কপি করা
          cp -r * build_dir/www/ || true
          
          # ৩. প্রজেক্টের মেইন ফোল্ডারে যাওয়া
          cd build_dir
          
          # ৪. তোমার দেওয়া config.xml ফাইলটি রিপ্লেস করা
          cp ../config.xml .
          
          # ৫. প্লাগইন যোগ করা (লিঙ্ক সচল করার জন্য)
          cordova plugin add cordova-plugin-inappbrowser
          
          # ৬. অ্যান্ড্রয়েড প্ল্যাটফর্ম যোগ করা
          cordova platform add android
          
          # ৭. ফাইনাল APK বিল্ড করা
          cordova build android --debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4 # এই ভার্সনটি লেটেস্ট, তাই আর ফেইল করবে না
        with:
          name: shesh-josna-app
          path: build_dir/platforms/android/app/build/outputs/apk/debug/app-debug.apk
