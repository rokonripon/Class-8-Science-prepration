name: Build APK
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Cordova
        run: npm install -g cordova

      - name: Create and Build Cordova Project
        run: |
          # ১. পুরনো বিল্ড ডিরেক্টরি থাকলে তা মুছে নতুন করে তৈরি করা
          rm -rf my_build_dir
          cordova create my_build_dir com.writer.sheshjosna "Shesh Josna"
          
          # ২. আপনার সব ফাইল (HTML, ছবি) কর্ডোভার www ফোল্ডারে কপি করা
          # এখানে '*' ব্যবহার করা হয়েছে যাতে সব ফাইল যায়
          cp -v welcome.html my_build_dir/www/ || true
          cp -v index.html my_build_dir/www/ || true
          cp -v *.html my_build_dir/www/ || true
          cp -v *.png my_build_dir/www/ || true
          cp -v *.jpg my_build_dir/www/ || true
          
          # ৩. আপনার config.xml ফাইলটি কপি করা
          cp -v config.xml my_build_dir/config.xml || echo "config.xml not found, using default"

          # ৪. বিল্ড ডিরেক্টরির ভেতরে যাওয়া
          cd my_build_dir
          
          # ৫. প্রয়োজনীয় প্লাগইন এবং অ্যান্ড্রয়েড প্ল্যাটফর্ম যোগ করা
          cordova plugin add cordova-plugin-inappbrowser
          cordova platform add android
          
          # ৬. ফাইনাল APK বিল্ড করা
          cordova build android --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Shesh-Josna-App
          path: my_build_dir/platforms/android/app/build/outputs/apk/debug/app-debug.apk
