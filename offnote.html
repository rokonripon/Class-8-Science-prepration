<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>অফলাইন লাইব্রেরি</title>
    <style>
        body { font-family: sans-serif; background: #f4f4f9; margin: 0; padding: 20px; }
        .button-container { display: flex; flex-direction: column; gap: 12px; max-width: 450px; margin: auto; }
        .pdf-button {
            background: linear-gradient(135deg, #6e8efb, #a777e3);
            color: white; border: none; padding: 18px; border-radius: 12px;
            font-size: 16px; font-weight: bold; cursor: pointer; text-align: left;
            display: flex; justify-content: space-between; align-items: center;
        }
        .status-tag { font-size: 11px; background: rgba(0,0,0,0.3); padding: 4px 8px; border-radius: 5px; }
        #pdfOverlay { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: #323639; z-index: 9999; flex-direction: column; }
        #toolbar { background: #202124; color: white; padding: 15px; display: flex; justify-content: space-between; }
        #canvas-holder { flex: 1; overflow: auto; background: #525659; -webkit-overflow-scrolling: touch; }
        canvas { display: block; margin: 8px auto; width: 100%; box-shadow: 0 0 15px rgba(0,0,0,0.5); }
        .loader { border: 4px solid #f3f3f3; border-top: 4px solid #3498db; border-radius: 50%; width: 30px; height: 30px; animation: spin 1s linear infinite; margin: 20px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <h2 style="text-align:center">আমার বইপত্র</h2>
    <div id="msg" style="text-align:center; margin-bottom:10px; color:#555;">চেক করা হচ্ছে...</div>
    <div class="button-container" id="btnContainer"></div>

    <div id="pdfOverlay">
        <div id="toolbar">
            <span id="pdf-title">বই</span>
            <button onclick="closeViewer()" style="background:#e74c3c; color:white; border:none; padding:5px 15px; border-radius:5px; cursor:pointer;">বন্ধ করুন</button>
        </div>
        <div id="canvas-holder"></div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.10.377/pdf.min.js"></script>
    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbx00-QMSO2h03C52xWPitoHFm0EPb6mYGJQw46s1pdBSaf6al40Y-gz8NUkyCGJCcng/exec"; 
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.10.377/pdf.worker.min.js';

        let db;
        const request = indexedDB.open("OfflinePDFs", 1);
        request.onupgradeneeded = e => e.target.result.createObjectStore("pdfs", { keyPath: "id" });
        request.onsuccess = e => { db = e.target.result; loadList(); };

        async function loadList() {
            try {
                const res = await fetch(SCRIPT_URL);
                const files = await res.json();
                renderUI(files);
            } catch (e) {
                const tx = db.transaction("pdfs", "readonly");
                const req = tx.objectStore("pdfs").getAll();
                req.onsuccess = () => renderUI(req.result, true);
            }
        }

        async function renderUI(files, isOffline = false) {
            const container = document.getElementById('btnContainer');
            container.innerHTML = "";
            for (let f of files) {
                const saved = await getFromDB(f.id);
                const btn = document.createElement('button');
                btn.className = 'pdf-button';
                btn.innerHTML = `<span>📄 ${f.name}</span> <span class="status-tag">${saved ? 'ফোনে আছে' : 'ডাউনলোড'}</span>`;
                btn.onclick = () => handleAction(f);
                container.appendChild(btn);
            }
            document.getElementById('msg').innerText = isOffline ? "অফলাইন মোড" : "অনলাইন মোড";
        }

        async function handleAction(file) {
            const saved = await getFromDB(file.id);
            if (saved) {
                showPDF(saved.data, file.name);
            } else {
                document.getElementById('msg').innerText = "ডাউনলোড হচ্ছে...";
                try {
                    const res = await fetch(`${SCRIPT_URL}?fileId=${file.id}`);
                    const base64 = await res.text();
                    saveToDB(file.id, file.name, base64);
                    showPDF(base64, file.name);
                } catch (e) { alert("ডাউনলোড ব্যর্থ!"); }
            }
        }

        function saveToDB(id, name, data) {
            const tx = db.transaction("pdfs", "readwrite");
            tx.objectStore("pdfs").put({ id, name, data });
            loadList();
        }

        function getFromDB(id) {
            return new Promise(r => {
                const tx = db.transaction("pdfs", "readonly");
                const req = tx.objectStore("pdfs").get(id);
                req.onsuccess = () => r(req.result);
            });
        }

        async function showPDF(base64, name) {
            document.getElementById('pdfOverlay').style.display = 'flex';
            document.getElementById('pdf-title').innerText = name;
            const holder = document.getElementById('canvas-holder');
            holder.innerHTML = '<div class="loader"></div>';

            try {
                const pdfData = atob(base64);
                const pdf = await pdfjsLib.getDocument({data: pdfData}).promise;
                holder.innerHTML = "";

                // রেজোলিউশন বাড়ানোর জন্য পিক্সেল রেশিও নেওয়া
                const scale_factor = window.devicePixelRatio || 1;

                for (let i = 1; i <= pdf.numPages; i++) {
                    const page = await pdf.getPage(i);
                    
                    // স্ক্রিন উইডথ অনুযায়ী ভিউপোর্ট
                    const base_viewport = page.getViewport({ scale: window.innerWidth / page.getViewport({scale:1}).width });
                    
                    const canvas = document.createElement('canvas');
                    const context = canvas.getContext('2d');

                    // ক্যানভাস সাইজকে পিক্সেল রেশিও দিয়ে গুণ করা (এটিই ক্লিয়ার করবে)
                    canvas.width = Math.floor(base_viewport.width * scale_factor);
                    canvas.height = Math.floor(base_viewport.height * scale_factor);
                    
                    // ডিসপ্লে সাইজ ঠিক রাখা
                    canvas.style.width = "100%";
                    canvas.style.height = "auto";

                    const renderContext = {
                        canvasContext: context,
                        viewport: base_viewport,
                        transform: [scale_factor, 0, 0, scale_factor, 0, 0] // শার্প রেন্ডারিং
                    };

                    await page.render(renderContext).promise;
                    holder.appendChild(canvas);
                }
                document.getElementById('msg').innerText = "পড়া হচ্ছে: " + name;
            } catch (e) {
                console.error(e);
                alert("পিডিএফ দেখাতে সমস্যা হচ্ছে।");
            }
        }

        function closeViewer() { 
            document.getElementById('pdfOverlay').style.display = 'none'; 
            document.getElementById('canvas-holder').innerHTML = ""; 
        }
    </script>
</body>
</html>
