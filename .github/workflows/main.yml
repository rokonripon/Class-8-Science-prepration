name: Build APK
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Cordova
        run: npm install -g cordova

      - name: Create and Build Cordova Project
        run: |
          # ১. পুরনো ডিরেক্টরি থাকলে মুছে ফেলা
          rm -rf my_build_dir
          
          # ২. কর্ডোভা প্রজেক্ট তৈরি (নিজস্ব নামে)
          cordova create my_build_dir com.writer.sheshjosna "Shesh Josna"
          
          # ৩. আপনার সব ফাইল (HTML, ছবি) কর্ডোভার www ফোল্ডারে কপি করা
          # এখানে সবগুলো ফাইল আলাদাভাবে কপি করার চেষ্টা করবে যাতে ভুল না হয়
          cp -v welcome.html my_build_dir/www/ || true
          cp -v index.html my_build_dir/www/ || true
          cp -v *.html my_build_dir/www/ || true
          cp -v *.png my_build_dir/www/ || true
          cp -v *.jpg my_build_dir/www/ || true
          
          # ৪. আপনার দেওয়া config.xml ফাইলটি নির্দিষ্ট জায়গায় বসানো
          cp -v config.xml my_build_dir/config.xml || echo "config.xml not found!"

          # ৫. বিল্ড ডিরেক্টরির ভেতরে গিয়ে কাজ শুরু করা
          cd my_build_dir
          
          # ৬. বাইরের লিঙ্ক (রকমারি) সচল করার প্লাগইন ও অ্যান্ড্রয়েড প্ল্যাটফর্ম যোগ করা
          cordova plugin add cordova-plugin-inappbrowser
          cordova platform add android
          
          # ৭. ফাইনাল APK বিল্ড করা
          cordova build android --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Shesh-Josna-App
          path: my_build_dir/platforms/android/app/build/outputs/apk/debug/app-debug.apk
