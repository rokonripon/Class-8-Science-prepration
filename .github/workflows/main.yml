name: Build APK
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Cordova
        run: npm install -g cordova

      - name: Create and Build Project
        run: |
          # বিল্ড ডিরেক্টরি তৈরি
          cordova create build_dir com.writer.sheshjosna "ScienceHelper"
          
          # আপনার সব ফাইল কপি করা
          cp -r * build_dir/www/ || true
          cp icon.png build_dir/www/icon.png || true
          cp config.xml build_dir/config.xml || true
          
          cd build_dir
          
          # লিঙ্ক সচল করার জন্য প্লাগইন
          cordova plugin add cordova-plugin-inappbrowser
          
          # প্ল্যাটফর্ম যোগ ও বিল্ড
          cordova platform add android
          cordova build android --debug --device

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Science-Helper-App
          path: build_dir/platforms/android/app/build/outputs/apk/debug/app-debug.apk
